name: MyProxy Multiplatform Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  XRAY_VERSION: v26.3.27

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android checks
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing required GitHub Secret: KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          test -s "$RUNNER_TEMP/release-keystore.jks" || exit 1
          chmod 600 "$RUNNER_TEMP/release-keystore.jks"

      - name: Build signed Android APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Android assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="manual-${GITHUB_RUN_NUMBER}"; fi
          apk="$RUNNER_TEMP/MyProxy-${version}-android.apk"
          cp "$source_apk" "$apk"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=${apk}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: myproxy-android-apk
          path: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.checksum }}
          if-no-files-found: error

  build-desktop:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            resource_dir: windows-x64
            xray_asset: Xray-windows-64.zip
            xray_sha256: d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad
            executable: xray.exe
          - target: macos-x64
            os: macos-15-intel
            resource_dir: macos-x64
            xray_asset: Xray-macos-64.zip
            xray_sha256: f5b0471d3459eff1b82e48af0aeac186abcc3298210070afbbbd8437a4e8b203
            executable: xray
          - target: macos-arm64
            os: macos-15
            resource_dir: macos-arm64
            xray_asset: Xray-macos-arm64-v8a.zip
            xray_sha256: 2e93a67e8aa1936ecefb307e120830fcbd4c643ab9b1c46a2d0838d5f8409eaf
            executable: xray
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Download and verify Xray-core
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then runner_temp="$(cygpath -u "$RUNNER_TEMP")"; fi
          archive="$runner_temp/${{ matrix.xray_asset }}"
          unpacked="$runner_temp/xray-unpacked"
          resources="desktopApp/resources/${{ matrix.resource_dir }}"
          curl --fail --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${{ matrix.xray_asset }}" \
            --output "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${{ matrix.xray_sha256 }}  $archive" | sha256sum --check
          else
            test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "${{ matrix.xray_sha256 }}"
          fi
          mkdir -p "$unpacked" "$resources"
          unzip -q "$archive" -d "$unpacked"
          cp "$unpacked/${{ matrix.executable }}" "$resources/${{ matrix.executable }}"
          cp "$unpacked/geoip.dat" "$resources/geoip.dat"
          cp "$unpacked/geosite.dat" "$resources/geosite.dat"
          if [ -f "$unpacked/LICENSE" ]; then cp "$unpacked/LICENSE" "$resources/XRAY_LICENSE.txt"; fi
          chmod +x "$resources/${{ matrix.executable }}"
          "$resources/${{ matrix.executable }}" version
          "$resources/${{ matrix.executable }}" run -test -c desktopApp/src/test/resources/direct-config.json

      - name: Test and create desktop distribution
        shell: bash
        run: ./gradlew :desktopApp:test :desktopApp:createDistributable --stacktrace

      - name: Package Windows portable app
        if: runner.os == 'Windows'
        id: windows_assets
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          if (-not $env:GITHUB_REF.StartsWith("refs/tags/v")) { $version = "manual-$env:GITHUB_RUN_NUMBER" }
          $app = Get-ChildItem "desktopApp/build/compose/binaries/main/app" -Directory -Recurse |
            Where-Object Name -eq "MyProxy" | Select-Object -First 1
          if (-not $app) { throw "Windows application image was not produced" }
          $core = Get-ChildItem $app.FullName -Filter "xray.exe" -File -Recurse | Select-Object -First 1
          if (-not $core) { throw "Packaged Windows application is missing xray.exe" }
          $asset = Join-Path $env:RUNNER_TEMP "MyProxy-$version-windows-x64.zip"
          Compress-Archive -Path $app.FullName -DestinationPath $asset -CompressionLevel Optimal
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$asset.sha256", "$hash  $([IO.Path]::GetFileName($asset))`n")
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$asset.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package macOS application
        if: runner.os == 'macOS'
        id: macos_assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="manual-${GITHUB_RUN_NUMBER}"; fi
          app="$(find desktopApp/build/compose/binaries/main/app -type d -name 'MyProxy.app' -print -quit)"
          test -n "$app"
          core="$(find "$app" -type f -name xray -print -quit)"
          test -n "$core"
          chmod +x "$core"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          asset="$RUNNER_TEMP/MyProxy-${version}-${{ matrix.target }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$asset"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$(basename "$asset")" > "$(basename "$asset").sha256")
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "checksum=${asset}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: myproxy-${{ matrix.target }}
          path: |
            ${{ steps.windows_assets.outputs.asset }}
            ${{ steps.windows_assets.outputs.checksum }}
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: myproxy-${{ matrix.target }}
          path: |
            ${{ steps.macos_assets.outputs.asset }}
            ${{ steps.macos_assets.outputs.checksum }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: myproxy-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-assets
          test "$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f ! -name '*.sha256' | wc -l)" -eq 4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MyProxy $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "本版本提供 Android、Windows x64、macOS Intel 和 macOS Apple Silicon。桌面端采用系统代理模式；macOS 包为 ad-hoc 签名、未进行 Apple 公证。"
