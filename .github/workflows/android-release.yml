name: Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing required GitHub Secret: KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          if [ ! -s "$RUNNER_TEMP/release-keystore.jks" ]; then
            echo "::error::Decoded release keystore is empty"
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/release-keystore.jks"

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare release assets
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$source_apk" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="manual-${GITHUB_RUN_NUMBER}"
          fi

          apk_path="$RUNNER_TEMP/MyProxy-${version}-android.apk"
          checksum_path="${apk_path}.sha256"
          cp "$source_apk" "$apk_path"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk_path")" > "$(basename "$checksum_path")")
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: myproxy-release-apk
          path: |
            ${{ steps.release_assets.outputs.apk_path }}
            ${{ steps.release_assets.outputs.checksum_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.release_assets.outputs.apk_path }}#MyProxy Android APK" \
            "${{ steps.release_assets.outputs.checksum_path }}#SHA-256 checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MyProxy $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Android 首个公开版本。当前仅提供 Android APK；iOS 和 Windows 客户端列入后续规划。"
